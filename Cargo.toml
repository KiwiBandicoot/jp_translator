[package]
name = "jp_translator"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
urlencoding = "2.1"
kakasi = "0.1"
tokio = { version = "1.0", features = ["full"] }